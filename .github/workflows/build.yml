name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Portable tests
        run: make test

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq g++-mingw-w64-x86-64-posix
      - name: Cross-compile usbscope.exe (static)
        run: make CROSS=x86_64-w64-mingw32- CXX=g++-posix
      - run: mv usbscope.exe usbscope-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: usbscope-windows-x64
          path: usbscope-windows-x64.exe

  release:
    if: github.event_name == 'push'
    needs: [test, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$(grep -oP 'kVersion = "\K[^"]+' src/theme.hpp)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" != refs/tags/* ]] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "$tag already released"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"; echo "new release: $tag"
          fi

      - if: steps.ver.outputs.new == 'true'
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: usbscope ${{ steps.ver.outputs.tag }}
          files: dist/usbscope-windows-x64.exe
          generate_release_notes: true
